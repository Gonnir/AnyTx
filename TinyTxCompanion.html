<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyTx Companion</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --panel2:#efebe0; --ink:#1d1b16; --mute:#6d675a; --line:#d9d3c4;
  --accent:#c4590a; --accent-ink:#fff; --ok:#2f7d3a; --bad:#b3261e; --warn:#a66a00;
  --bar:#e3ddcc; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14130f; --panel:#1d1b16; --panel2:#26231c; --ink:#ece7da; --mute:#9a9381; --line:#38342a;
        --accent:#f08a3c; --accent-ink:#1a1100; --ok:#6cc27a; --bad:#ff7b72; --warn:#e3b341; --bar:#2f2b22;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px}
.brand{font-weight:700;letter-spacing:.02em;font-size:16px}
.brand b{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--panel2);font-size:12px;color:var(--mute)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.pill.on{color:var(--ok)} .pill.on i{background:var(--ok)}
.pill.wait{color:var(--warn)} .pill.wait i{background:var(--warn)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.bad{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.layout{display:grid;grid-template-columns:190px 1fr;gap:16px;max-width:1180px;margin:0 auto;padding:16px}
nav{display:flex;flex-direction:column;gap:3px;position:sticky;top:64px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
nav button{text-align:left;border:0;background:none;padding:8px 12px;border-radius:7px;cursor:pointer;color:var(--mute)}
nav button:hover{background:var(--panel2)}
nav button.on:hover{background:var(--panel2)}
nav button.on{background:var(--panel2);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 var(--accent)}
nav .grp{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);padding:12px 12px 3px}
main{min-width:0}
h2{margin:0 0 4px;font-size:24px;font-weight:800}
.sub{color:var(--mute);margin:0 0 14px}
.ctxbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-left:4px solid var(--accent);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.ctxbar .t{font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3,main>h3,.srcrow+h3{margin:0 0 10px;font-size:15px;font-weight:800;color:var(--accent);letter-spacing:.01em;display:flex;align-items:center;gap:8px;
  padding-bottom:5px;border-bottom:2px solid color-mix(in srgb,var(--accent) 35%,transparent)}
main>h3{margin-top:18px}
details.card>summary{font-size:16px;font-weight:800!important;color:var(--accent)}
details.card>summary .note{color:var(--mute);font-weight:400}
.srcrow>b{color:var(--ink);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f>span{font-size:12px;font-weight:400;color:var(--mute)}
.f.row{flex-direction:row;align-items:center;gap:8px}
.f.row>span{color:var(--ink);font-size:14px}
input[type=number],input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;min-width:0}
input:focus,select:focus,.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.val{font-family:var(--mono);font-size:12px;color:var(--mute);text-align:right}
.srcrow{display:grid;grid-template-columns:70px repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end;padding:6px 0;border-top:1px dashed var(--line)}
.srcrow:first-of-type{border-top:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
td.act{text-align:right;white-space:nowrap}
td.act .btn{margin-left:4px}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink);margin-left:6px}
.mono{font-family:var(--mono)}
.empty{padding:30px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:44px 1fr 120px;align-items:center;gap:10px}
.bar .track{height:14px;background:var(--bar);border-radius:7px;position:relative;overflow:hidden}
.bar .track::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--mute);opacity:.6}
.bar .fill{position:absolute;top:0;bottom:0;background:var(--accent)}
.dirty{color:var(--warn);font-size:12px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:18px;max-width:min(520px,94vw);width:100%}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 10px}
.dlgbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#log{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);max-height:34vh;overflow:auto;
  font:12px/1.4 var(--mono);padding:8px 14px;display:none;z-index:30}
#log.open{display:block}
#log .tx{color:var(--accent)} #log .rx{color:var(--mute)} #log .er{color:var(--bad)}
#toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;opacity:0;
  transition:opacity .2s;pointer-events:none;z-index:40;max-width:80vw}
#toast.show{opacity:1}
.note{font-size:12px;color:var(--mute)}
.hint{background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:13px}
.warnbox{background:color-mix(in srgb,var(--warn) 16%,var(--panel));border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:12px}
svg.curve{width:100%;height:auto;aspect-ratio:200/120;background:var(--bg);border:1px solid var(--line);border-radius:6px}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;padding:12px 16px}
  nav{flex-direction:row;overflow-x:auto;position:static;padding:6px}
  nav .grp{display:none} nav button{white-space:nowrap}
  header{position:static}
}
</style>
</head>
<body>
<header>
  <div class="brand">TinyTx <b>Companion</b></div>
  <span class="pill" id="status"><i></i><span>Not connected</span></span>
  <span class="note" id="devinfo"></span>
  <div class="spacer"></div>
  <button class="btn" id="bLog">Log</button>
  <button class="btn" id="bConnect">Connect</button>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div id="log"></div>
<div id="toast"></div>
<dialog id="dlg"></dialog>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   TinyTx Companion - talks to the TinyTx firmware (companion.h) over Web Serial.
   Everything is a flat key=value dictionary, exactly as the firmware sends it:
     global keys     mode out inv hd single autopol hidport raw stall
                     ppm thr loss snd snd.ev snd.tg.N inact
     profile keys    mid tso ch.N ch.N.cv ch.N.sK cal.N sf.N tm.N
   ═══════════════════════════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat(9)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ─── constants mirrored from config.h ─────────────────────────────────── */
const GLOBAL_KEYS = /^(mode|out|inv|hd|single|autopol|hidport|raw|stall|ppm|thr|loss|snd|snd\.ev|snd\.tg\.\d+|inact)$/;
const isProfileKey = k => /^(mid|tso|ch\.|cal\.|sf\.|tm\.)/.test(k);
const RESTART_KEYS = new Set(['mode', 'out', 'inv', 'hd', 'single', 'autopol', 'hidport']);
const MAX_PROFILES = 16, NAME_LEN = 13, SLOT_VID = 0xFFF0;
const NCH = 16, NAX = 16, NSF = 12, NTM = 4, NTG = 6, NMIX = 3;
const DEVICE_MODES = ['USB Input', 'SBUS In', 'PPM In', 'CRSF Aux In', 'Pot/Btn UART'];
const MIX_TYPES = ['None', 'Axis', 'Button'];
const TARGETS = ['Low', 'Mid', 'High'];
const FS_MODES = ['Hold', 'Value'];
const SF_TYPES = ['(empty)', 'Override Channel', 'Play Sound', 'Set Timer', 'Start Timer', 'Stop Timer', 'Reset Timer', 'Volume', 'Run Timer'];
const TRIG_TYPES = ['None', 'Axis', 'Button', 'Channel'];
const EVENTS = ['Startup', 'Link up', 'Link lost', 'Throttle warning', 'Signal low', 'Signal critical', 'Trim max', 'Trim min',
                'Trim centre', 'Inactivity', 'Minute (singular)', 'Minutes (plural)', 'Timer over'];
const SF_ORDER = [0, 1, 2, 3, 4, 5, 6, 7, 8]; // the firmware menu reorders these; the page keeps enum order

/* ─── state ────────────────────────────────────────────────────────────── */
const S = {
  cur: {},            // editable dictionary (global + profile part)
  base: {},           // what the device had when we last read/wrote
  ctx: { kind: 'none' }, // none | live | profile {vid,pid,name} | file {name}
  profiles: [], active: null,
  tab: 'profiles', live: null, restartNeeded: false,
};
const connected = () => link.ready;

/* ─── serial link ──────────────────────────────────────────────────────── */
const logEl = $('#log');
function log(cls, text) {
  const d = h('div', { class: cls }, (cls === 'tx' ? '→ ' : cls === 'rx' ? '← ' : '! ') + text);
  logEl.append(d); while (logEl.childNodes.length > 400) logEl.firstChild.remove();
  logEl.scrollTop = logEl.scrollHeight;
}
const link = {
  port: null, writer: null, buf: '', pending: null, queue: Promise.resolve(), ready: false, hello: null, ka: null, busy: 0,

  async open() {
    if (!('serial' in navigator)) throw new Error('This browser has no Web Serial. Use Chrome or Edge on a computer.');
    this.port = await navigator.serial.requestPort();
    await this.port.open({ baudRate: 420000, bufferSize: 16384 });
    this.writer = this.port.writable.getWriter();
    this.buf = ''; this.pending = null; this.queue = Promise.resolve();
    this.readLoop();
    await this.handshake();
    this.ready = true;
    this.ka = setInterval(() => { if (this.ready && !this.busy) this.cmd('PING', 3000, true); }, 3000);
  },
  async readLoop() {
    const reader = this.port.readable.getReader(), dec = new TextDecoder();
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        this.buf += dec.decode(value, { stream: true });
        let i;
        while ((i = this.buf.indexOf('\n')) >= 0) {
          const l = this.buf.slice(0, i).replace(/\r$/, ''); this.buf = this.buf.slice(i + 1);
          if (l) this.onLine(l);
        }
      }
    } catch (e) { log('er', 'read: ' + e.message); }
    try { reader.releaseLock(); } catch {}
    this.dropped();
  },
  onLine(l) {
    if (l.startsWith('L ')) { if (S.live) S.live(l.slice(2).split(',').map(Number)); return; }
    if (l.startsWith('OK TinyTxCompanion')) {
      if (this.hello) { log('rx', l); this.hello(l); this.hello = null; }
      return;                                  // a stale duplicate otherwise
    }
    const p = this.pending;
    if (!p) return;
    if (l === 'OK' || l.startsWith('OK ')) { log('rx', 'OK'); p.done({ ok: true, lines: p.lines }); }
    else if (l.startsWith('ERR')) { log('er', l); p.done({ ok: false, msg: l.slice(4) || 'error', lines: p.lines }); }
    else p.lines.push(l);
  },
  send(text) { return this.writer.write(new TextEncoder().encode(text)); },
  async handshake() {
    for (let i = 0; i < 24; i++) {
      const got = new Promise(r => { this.hello = r; });
      await this.send('\nHELLO\n');
      const r = await Promise.race([got, sleep(450).then(() => null)]);
      if (r) { await sleep(700); this.pending = null; return; }
    }
    this.hello = null;
    throw new Error('No answer from the board. Check wiring (adapter RX to GP0, TX to GP1, GND), 3.3 V, 420000 baud, and that the ELRS module is unplugged. The board must be in CRSF output mode.');
  },
  cmd(text, timeout = 8000, quiet = false) {
    this.busy++;
    const run = () => new Promise(res => {
      const p = { lines: [] };
      p.done = r => { clearTimeout(p.t); if (this.pending === p) this.pending = null; res(r); };
      p.t = setTimeout(() => { log('er', 'timeout: ' + text); p.done({ ok: false, msg: 'timeout', lines: p.lines }); }, timeout);
      this.pending = p;
      if (!quiet) log('tx', text);
      this.send(text + '\n').catch(e => p.done({ ok: false, msg: e.message, lines: [] }));
    });
    const r = this.queue.then(run, run);
    this.queue = r.catch(() => {}).then(() => { this.busy--; });
    return r;
  },
  async close(sayBye = true) {
    clearInterval(this.ka);
    if (this.ready && sayBye) { try { await this.cmd('BYE', 1500); } catch {} }
    this.ready = false;
    try { this.writer && this.writer.releaseLock(); } catch {}
    try { await this.port.close(); } catch {}
    this.port = null; this.dropped();
  },
  dropped() { this.ready = false; clearInterval(this.ka); S.live = null; renderAll(); },
};

/* ─── key/value helpers ────────────────────────────────────────────────── */
function parseLines(lines) {
  const d = {}; let name = null;
  for (const l of lines) { const i = l.indexOf('='); if (i < 0) continue; const k = l.slice(0, i), v = l.slice(i + 1); if (k === 'name') name = v; else d[k] = v; }
  return { d, name };
}
const L = k => (S.cur[k] ?? '').split(',').map(Number);
function put(k, i, v) {
  const a = L(k); a[i] = v; S.cur[k] = a.join(','); markDirty();
  const m = k.match(/^ch\.(\d+)(\.cv)?$/); if (m && curves[m[1]]) drawCurve(+m[1]);
}
const curves = {};
const has = k => k in S.cur;
const hex4 = n => n.toString(16).toUpperCase().padStart(4, '0');
const changedKeys = () => Object.keys(S.cur).filter(k => S.cur[k] !== S.base[k]);
function markDirty() {
  const n = changedKeys().length;
  const e = $('#dirty'); if (e) e.textContent = n ? n + ' unsaved change' + (n > 1 ? 's' : '') : '';
  for (const w of document.querySelectorAll('#bWrite')) w.disabled = !n || !connected() || S.ctx.kind === 'file' || S.ctx.kind === 'none';
}

/* ─── device I/O ───────────────────────────────────────────────────────── */
async function readLive() {
  const r = await link.cmd('GET', 15000);
  if (!r.ok) { toast('Read failed: ' + r.msg); return; }
  const { d } = parseLines(r.lines);
  S.cur = { ...d }; S.base = { ...d };
  S.ctx = { kind: 'live' };
}
async function refreshProfiles() {
  const r = await link.cmd('PLIST');
  if (!r.ok) { toast('Profile list failed: ' + r.msg); return; }
  S.profiles = []; S.active = null;
  for (const l of r.lines) {
    const m = l.match(/^P ([0-9A-F]{4}) ([0-9A-F]{4}) (.*)$/);
    if (m) S.profiles.push({ vid: parseInt(m[1], 16), pid: parseInt(m[2], 16), name: m[3] });
    const a = l.match(/^A ([0-9A-F]{4}) ([0-9A-F]{4})$/);
    if (a) S.active = { vid: parseInt(a[1], 16), pid: parseInt(a[2], 16) };
  }
}
const isActive = p => S.active && S.active.vid === p.vid && S.active.pid === p.pid;
async function fetchProfile(p) {
  const r = await link.cmd(`PGET ${hex4(p.vid)} ${hex4(p.pid)}`, 10000);
  if (!r.ok) throw new Error(r.msg);
  return parseLines(r.lines);
}
async function editProfile(p) {
  try {
    const { d, name } = await fetchProfile(p);
    // keep the global part from the device, replace the profile part
    const g = Object.fromEntries(Object.entries(S.cur).filter(([k]) => !isProfileKey(k)));
    S.cur = { ...g, ...d }; S.base = { ...S.cur };
    S.ctx = { kind: 'profile', vid: p.vid, pid: p.pid, name: name || p.name };
    S.tab = 'channels'; renderAll();
  } catch (e) { toast('Could not read profile: ' + e.message); }
}
async function editLive() { await withBusy('Reading…', async () => { await readLive(); renderAll(); }); }

async function sendProfile(vid, pid, name, dict, overwriteOk = true) {
  let r = await link.cmd(`PBEGIN ${hex4(vid)} ${hex4(pid)} ${name}`);
  if (!r.ok) throw new Error(r.msg);
  for (const [k, v] of Object.entries(dict)) {
    if (!isProfileKey(k)) continue;
    r = await link.cmd(`PSET ${k}=${v}`, 4000, true);
    if (!r.ok) throw new Error(`${k}: ${r.msg}`);
  }
  r = await link.cmd('PEND', 10000);
  if (!r.ok) throw new Error(r.msg);
}
function freeSlot() {
  const used = new Set(S.profiles.filter(p => p.vid === SLOT_VID).map(p => p.pid));
  for (let i = 0; i < MAX_PROFILES; i++) if (!used.has(i)) return i;
  return -1;
}

async function writeChanges() {
  const keys = changedKeys();
  if (!keys.length) return;
  await withBusy('Writing…', async () => {
    const gk = keys.filter(k => GLOBAL_KEYS.test(k));
    const pk = keys.filter(isProfileKey);
    for (const k of gk) { const r = await link.cmd(`SET ${k}=${S.cur[k]}`, 4000, true); if (!r.ok) throw new Error(`${k}: ${r.msg}`); }
    if (S.ctx.kind === 'live') {
      for (const k of pk) { const r = await link.cmd(`SET ${k}=${S.cur[k]}`, 4000, true); if (!r.ok) throw new Error(`${k}: ${r.msg}`); }
    } else if (S.ctx.kind === 'profile' && pk.length) {
      await sendProfile(S.ctx.vid, S.ctx.pid, S.ctx.name, S.cur);
    }
    if (gk.length || S.ctx.kind === 'live') { const r = await link.cmd('APPLY', 10000); if (!r.ok) throw new Error(r.msg); }
    if (S.ctx.kind === 'live' && pk.length && $('#chkActive') && $('#chkActive').checked && S.active) {
      const r = await link.cmd('PSAVE'); if (!r.ok) throw new Error(r.msg);
    }
    if (gk.some(k => RESTART_KEYS.has(k))) S.restartNeeded = true;
    await refreshProfiles();
    S.base = { ...S.cur };
    toast('Written to the device');
  });
}

async function withBusy(msg, fn) {
  document.body.style.cursor = 'progress';
  try { await fn(); } catch (e) { toast('Error: ' + e.message); log('er', e.message); }
  finally { document.body.style.cursor = ''; renderAll(); }
}

/* ─── dialogs ──────────────────────────────────────────────────────────── */
const dlg = $('#dlg');
function dialog(title, body, buttons) {
  dlg.replaceChildren(h('h3', null, title), body,
    h('div', { class: 'dlgbtns' }, buttons.map(b => h('button', { class: 'btn ' + (b.cls || ''), onclick: async () => { if (!b.fn || (await b.fn()) !== false) dlg.close(); } }, b.label))));
  dlg.showModal();
}
function askName(title, initial, okLabel, fn, extra) {
  const inp = h('input', { type: 'text', maxlength: NAME_LEN, value: initial });
  dialog(title, h('div', null, h('label', { class: 'f' }, h('span', null, `Name (up to ${NAME_LEN} characters)`), inp), extra || null),
    [{ label: 'Cancel' }, { label: okLabel, cls: 'pri', fn: () => { const n = inp.value.trim().replace(/=/g, ''); if (!n) return false; withBusy('…', () => fn(n)); } }]);
  inp.focus(); inp.select();
}

/* ─── profile actions ──────────────────────────────────────────────────── */
async function loadOnDevice(p) {
  await withBusy('', async () => {
    const r = await link.cmd(`PLOAD ${hex4(p.vid)} ${hex4(p.pid)}`); if (!r.ok) throw new Error(r.msg);
    await readLive(); await refreshProfiles(); toast(`"${p.name}" is now running on the device`);
  });
}
function renameProfile(p) {
  askName('Rename profile', p.name, 'Rename', async n => {
    const r = await link.cmd(`PREN ${hex4(p.vid)} ${hex4(p.pid)} ${n}`); if (!r.ok) throw new Error(r.msg);
    if (S.ctx.kind === 'profile' && S.ctx.vid === p.vid && S.ctx.pid === p.pid) S.ctx.name = n;
    await refreshProfiles();
  });
}
function deleteProfile(p) {
  dialog('Delete profile?', h('p', null, `"${p.name}" will be removed from the device. A backup file is the only way to get it back.`),

// spec: {t:'num'|'sel'|'chk'|'rng', min,max,step, opts:[], re:true (re-render pane), fmt:(v)=>str, off, scale}
function ctl(key, i, spec) {
  const get = () => L(key)[i];
  const set = v => { put(key, i, v); if (spec.re) renderPane(); };
  if (spec.t === 'chk') return h('input', { type: 'checkbox', checked: !!get(), onchange: e => set(e.target.checked ? 1 : 0) });
  if (spec.t === 'sel') {
    const s = h('select', { onchange: e => set(+e.target.value) }, spec.opts.map((o, n) => h('option', { value: spec.vals ? spec.vals[n] : n }, o)));
    s.value = String(get()); if (s.selectedIndex < 0 && spec.none != null) s.value = String(spec.none);
    return s;
  }
  if (spec.t === 'rng') {
    const v = h('div', { class: 'val' }); const show = x => v.textContent = spec.fmt ? spec.fmt(x) : x;
    const r = h('input', { type: 'range', min: spec.min, max: spec.max, step: spec.step || 1, value: get(), oninput: e => { show(+e.target.value); set(+e.target.value); } });
    show(get()); return h('div', null, r, v);
  }
  return h('input', { type: 'number', min: spec.min, max: spec.max, step: spec.step || 1, value: get(),
    oninput: e => { const x = e.target.valueAsNumber; if (!isNaN(x) && x >= (spec.min ?? -1e9) && x <= (spec.max ?? 1e9) && !spec.re) put(key, i, x); }, onchange: e => {
    let x = +e.target.value; if (isNaN(x)) x = spec.min ?? 0; x = Math.max(spec.min ?? -1e9, Math.min(spec.max ?? 1e9, x)); e.target.value = x; set(x); } });
}

// Same maths as the firmware mixer (input.cpp): expo or 5-point curve, then weight, then trim.
function responseAt(x, c, cv) {
  let y;
  if (c[2]) {
    const pos = (x + 1) * 2, i = Math.min(3, Math.floor(pos)), f = pos - i;
    y = (cv[i] + (cv[i + 1] - cv[i]) * f) / 100;
  } else {
    const e = c[1] / 100;
    y = e > 0 ? x * (1 - e) + x * x * x * e : x * (1 + e) + Math.sign(x) * Math.sqrt(Math.abs(x)) * -e;
  }
  return Math.max(-1, Math.min(1, y * c[3] / 100 + c[4] / 100));
}
function drawCurve(i) {
  const svg = curves[i]; if (!svg) return;
  const c = L(`ch.${i}`), cv = L(`ch.${i}.cv`), W = 200, H = 120, px = x => (x + 1) / 2 * (W - 8) + 4, py = y => H / 2 - y * (H / 2 - 6);
  let pts = '';
  for (let n = 0; n <= 40; n++) { const x = n / 20 - 1; pts += `${px(x).toFixed(1)},${py(responseAt(x, c, cv)).toFixed(1)} `; }
  const dots = c[2] ? cv.map((v, n) => `<circle cx="${px(n / 2 - 1)}" cy="${py(v / 100)}" r="3" fill="var(--accent)"/>`).join('') : '';
  svg.innerHTML = `<g stroke="currentColor" opacity=".25"><line x1="4" y1="${H / 2}" x2="${W - 4}" y2="${H / 2}"/><line x1="${W / 2}" y1="4" x2="${W / 2}" y2="${H - 4}"/>` +
    `<line x1="${px(-1)}" y1="${py(-1)}" x2="${px(1)}" y2="${py(1)}" stroke-dasharray="3 3"/></g>` +
    `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}`;
}
function curvePreview(i) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'curve'); svg.setAttribute('viewBox', '0 0 200 120');
  curves[i] = svg; drawCurve(i); return svg;
}

  const tso = +L('tso')[0];
  const g = h('div', { class: 'grid' });
  for (let i = 0; i < NCH; i++) g.append(FR(`CH${i + 1} trim sounds`, h('input', { type: 'checkbox', checked: !(tso & (1 << i)), onchange: e => {
    const cur = +L('tso')[0]; S.cur.tso = String(e.target.checked ? cur & ~(1 << i) : cur | (1 << i)); markDirty(); } })));
  return h('div', null,
    h('div', { class: 'card' }, h('h3', null, 'ELRS Model ID'), F('Model ID (0 = not set)', ctl('mid', 0, { t: 'num', min: 0, max: 255 })),
      h('p', { class: 'note' }, 'Sent to the ELRS module whenever it connects. Used for Model Match.')),
    h('div', { class: 'card' }, h('h3', null, 'Trim max / min / centre announcements'), g));
}

function paneSound() {
  if (!has('snd')) return emptyMsg();
  const root = h('div');
  root.append(h('div', { class: 'card' }, h('h3', null, 'Voice module'),
    h('div', { class: 'grid' }, FR('Sound enabled', ctl('snd', 0, { t: 'chk' })), F('Volume (0–30)', ctl('snd', 1, { t: 'rng', min: 0, max: 30 })))));
  const ev = h('div', { class: 'grid' });
  EVENTS.forEach((n, i) => ev.append(F(n, ctl('snd.ev', i, { t: 'num', min: 0, max: 3000 }))));
  root.append(h('div', { class: 'card' }, h('h3', null, 'Event tracks'), ev,
    h('p', { class: 'note' }, 'Track number = the Nth file copied to the SD card. 0 turns the event off. Numbers 0–110 are tracks 1–111, “minute” 111, “minutes” 112, “timer over” 113, then the alert phrases 114–123.')));
  for (let i = 0; i < NTG; i++) {
    const k = `snd.tg.${i}`, t = L(k);
    const g = h('div', { class: 'grid' }, F('Source', ctl(k, 0, { t: 'sel', opts: MIX_TYPES, re: true })));
    if (t[0] === 1) g.append(F('Axis', ctl(k, 1, { t: 'sel', opts: AXES, vals: range(NAX) })),
      F(`Threshold (${pctOf(t[2])}%)`, h('input', { type: 'range', min: -100, max: 100, value: pctOf(t[2]), oninput: e => { put(k, 2, rawOf(+e.target.value)); e.target.closest('label').firstChild.textContent = `Threshold (${e.target.value}%)`; } })),
      F('Fires crossing', ctl(k, 3, { t: 'sel', opts: ['Downward', 'Upward'] })));
    if (t[0] === 2) g.append(F('Button', ctl(k, 1, { t: 'sel', opts: BTNS, vals: range(32) })));
    if (t[0]) g.append(F('Track', ctl(k, 4, { t: 'num', min: 0, max: 3000 })));
    root.append(h('div', { class: 'card' }, h('h3', null, 'Sound trigger ' + (i + 1)), g));
  }
  return root;
}

function paneLink() {
  if (!has('mode')) return emptyMsg();
  const root = h('div');
  if (S.restartNeeded) root.append(h('div', { class: 'warnbox' }, 'Some of the changes you wrote only take effect after a restart. ',
    h('button', { class: 'btn sm', onclick: restartDevice }, 'Restart the board now')));
  root.append(
    h('div', { class: 'card' }, h('h3', null, 'Input & output (restart needed)'), h('div', { class: 'grid' },
      F('Input mode', ctl('mode', 0, { t: 'sel', opts: DEVICE_MODES })),
      F('Output on GP0', ctl('out', 0, { t: 'sel', opts: ['CRSF (ELRS module)', 'PPM (trainer port)'] })),
      F('USB controller port', ctl('hidport', 0, { t: 'sel', opts: ['Port 1', 'Port 2'] }))),
      h('p', { class: 'note' }, 'This page itself needs CRSF output. If you switch to PPM, change it back from the board’s menu before using the adapter again.')),
    h('div', { class: 'card' }, h('h3', null, 'CRSF line (restart needed)'), h('div', { class: 'grid' },
      FR('Inverted signal', ctl('inv', 0, { t: 'chk' })), FR('Half duplex', ctl('hd', 0, { t: 'chk' })),
      FR('Single pin (GP0 only)', ctl('single', 0, { t: 'chk' })), FR('Search polarity automatically', ctl('autopol', 0, { t: 'chk' })))),
    h('div', { class: 'card' }, h('h3', null, 'PPM output'), h('div', { class: 'grid' },
      F('Channels', ctl('ppm', 0, { t: 'num', min: 2, max: 16 })), F('Frame (µs)', ctl('ppm', 1, { t: 'num', min: 5000, max: 40000, step: 500 })),
      F('Pulse (µs)', ctl('ppm', 2, { t: 'num', min: 100, max: 1000, step: 50 })), FR('Inverted pulses', ctl('ppm', 3, { t: 'chk' })))),
    h('div', { class: 'card' }, h('h3', null, 'Safety'), h('div', { class: 'grid' },
      FR('Throttle must be low before output starts', ctl('thr', 0, { t: 'chk' })), F('Throttle channel', ctl('thr', 1, { t: 'sel', opts: CHS, vals: range(NCH) })),
      F('If the input is lost', ctl('loss', 0, { t: 'sel', opts: ['Keep sending failsafe values', 'Cut TX (receiver failsafe)'] })),
      F('Grace period (ms)', ctl('loss', 1, { t: 'num', min: 0, max: 5000, step: 100 })),
      FR('Force raw HID mode', ctl('raw', 0, { t: 'chk' })), FR('HID stall recovery', ctl('stall', 0, { t: 'chk' })))),
    h('div', { class: 'card' }, h('h3', null, 'Inactivity alarm'), h('div', { class: 'grid' },
      FR('Enabled', ctl('inact', 0, { t: 'chk' })), F('After (minutes)', ctl('inact', 1, { t: 'num', min: 1, max: 99 })))),
    h('div', { class: 'card' }, h('h3', null, 'Board'), h('button', { class: 'btn', disabled: !connected(), onclick: restartDevice }, 'Restart the board')));
  return root;
}
function restartDevice() {
  dialog('Restart the board?', h('p', null, 'Settings are saved first. The serial session ends; press Connect again afterwards.'),
    [{ label: 'Cancel' }, { label: 'Restart', cls: 'pri', fn: async () => { await link.cmd('REBOOT', 3000); S.restartNeeded = false; await sleep(300); await link.close(false); } }]);
}

function paneLive() {
  const root = h('div');
  if (!connected()) return h('div', { class: 'empty' }, 'Connect to the board to watch the channels.');
  const bars = h('div', { class: 'bars' }), els = [];
  for (let i = 0; i < NCH; i++) {
    const fill = h('div', { class: 'fill' }), val = h('div', { class: 'val' }, '–');
    els.push({ fill, val }); bars.append(h('div', { class: 'bar' }, h('b', null, 'CH' + (i + 1)), h('div', { class: 'track' }, fill), val));
  }
  S.live = arr => arr.forEach((v, i) => {
    const e = els[i]; if (!e) return;
    const p = Math.max(-100, Math.min(100, (v - 991.5) / 8.195)), us = Math.round((v - 992) * 5 / 8 + 1500);
    e.fill.style.left = (p < 0 ? 50 + p / 2 : 50) + '%'; e.fill.style.width = Math.abs(p) / 2 + '%';
    e.val.textContent = `${p.toFixed(0)}%  ${us}µs`;
  });
  link.cmd('LIVE 1', 3000, true);
  root.append(h('div', { class: 'card' }, bars), h('p', { class: 'note' }, 'Channel output after mixing, before the link-loss logic. The board streams this only while this tab is open.'));
  return root;
}

/* ─── shell ────────────────────────────────────────────────────────────── */
function renderNav() {
  const nav = $('#nav'); nav.replaceChildren();
  for (const grp of NAV) for (const id of grp) {
    if (PANES[id]) nav.append(h('button', { class: S.tab === id ? 'on' : '', onclick: () => setTab(id) }, PANES[id].title));
    else nav.append(h('div', { class: 'grp' }, id));
  }
}
function setTab(t) {
  if (S.tab === 'live' && t !== 'live' && connected()) { S.live = null; link.cmd('LIVE 0', 3000, true); }
  S.tab = t; renderAll();
}
function ctxBar() {
  const c = S.ctx;
  let label = 'No settings loaded yet', cls = '';
  if (c.kind === 'live') label = 'Editing: live settings running on the board';
  if (c.kind === 'profile') label = `Editing profile: ${c.name}`;
  if (c.kind === 'file') label = `Editing a copy from a backup file: ${c.name} (not on the board)`;
  const bar = h('div', { class: 'ctxbar' }, h('span', { class: 't' }, label), h('span', { class: 'dirty', id: 'dirty' }), h('span', { class: 'spacer' }));
  if (c.kind === 'live' && S.active) bar.append(h('label', { class: 'f row', title: 'Also write the live values into the active profile' }, h('input', { type: 'checkbox', id: 'chkActive', checked: true }), h('span', null, 'Also save into the active profile')));
  if (c.kind !== 'none') bar.append(h('button', { class: 'btn', disabled: !connected(), onclick: () => newProfileDialog('editor') }, 'Save as new profile…'));
  bar.append(h('button', { class: 'btn pri', id: 'bWrite', onclick: writeChanges }, 'Write to board'));
  return bar;
}
function renderPane() {
  const p = PANES[S.tab], main = $('#main'), y = scrollY;
  if (S.tab !== 'live') S.live = null;
  main.replaceChildren(h('h2', null, p.title), h('p', { class: 'sub' }, p.sub));
  if (p.edit || ['sound', 'link'].includes(S.tab)) main.append(ctxBar());
  main.append(p.fn());
  markDirty(); scrollTo(0, y);
}
function renderAll() {
  const st = $('#status'), on = connected();
  st.className = 'pill ' + (on ? 'on' : '');
  st.lastChild.textContent = on ? 'Connected' : 'Not connected';
  $('#bConnect').textContent = on ? 'Disconnect' : 'Connect';
  renderNav(); renderPane();
}

$('#bLog').onclick = () => logEl.classList.toggle('open');
$('#bConnect').onclick = async () => {
  if (connected()) { await link.close(); S.ctx = { kind: 'none' }; S.cur = {}; S.base = {}; renderAll(); return; }
  const st = $('#status'); st.className = 'pill wait'; st.lastChild.textContent = 'Connecting…';
  try {
    await link.open();
    await readLive(); await refreshProfiles();
    toast('Connected');
  } catch (e) {
    log('er', e.message); toast(e.message.length > 120 ? 'Could not connect – see the log' : e.message);
    if (!connected()) { try { await link.close(false); } catch {} }
    logEl.classList.add('open'); log('er', e.message);
  }
  renderAll();
};
addEventListener('beforeunload', () => { if (connected()) link.send('BYE\n').catch(() => {}); });
if ('serial' in navigator) navigator.serial.addEventListener('disconnect', () => { link.dropped(); });
else $('#devinfo').textContent = 'Web Serial needs Chrome or Edge';
renderAll();
</script>
</body>
</html>
